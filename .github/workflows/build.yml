name: Build and Release

on:
  # 手动触发打包（在仓库 Actions 页点击 Run workflow）
  workflow_dispatch:
  # 推 tag（如 v1.0.0）时自动构建并发布 Release
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: '${{ matrix.platform }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac：GitHub 的 arm64 runner 无法打 DMG(hdiutil 受限)，只产出 zip 免安装包
          - os: macos-latest
            platform: mac
            args: '--mac zip'
          - os: windows-latest
            platform: win
            args: '--win'
          - os: ubuntu-latest
            platform: linux
            args: '--linux'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build for ${{ matrix.platform }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARGS: ${{ matrix.args }}
        run: npx electron-builder $ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'm3u8-player-${{ matrix.platform }}'
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

      # 仅在打 v* tag 时发布 GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
