name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  # 手动触发打包（在仓库 Actions 页点击 Run workflow）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: '${{ matrix.platform }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac：GitHub 的 arm64 runner 无法打 DMG(hdiutil 受限)，只产出 zip 免安装包
          - os: macos-latest
            platform: mac
            args: '--mac zip'
          - os: windows-latest
            platform: win
            args: '--win'
          - os: ubuntu-latest
            platform: linux
            args: '--linux'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # 从 fastfetch 的 GitHub Release 下载预编译二进制（不依赖系统包仓库，更稳）
      - name: Install fastfetch
        shell: bash
        run: |
          set -e
          VER=$(curl -fsSL https://api.github.com/repos/fastfetch-cli/fastfetch/releases/latest | grep -i '"tag_name"' | head -1 | sed 's/.*"v\([^"]*\)".*/\1/')
          echo "fastfetch version: v${VER}"
          case "$RUNNER_OS" in
            macOS)
              ARCH=x86_64
              [ "$(uname -m)" = "arm64" ] && ARCH=aarch64
              curl -fsSL -o ff.tar.gz "https://github.com/fastfetch-cli/fastfetch/releases/download/v${VER}/fastfetch-macos-${ARCH}.tar.gz"
              tar -xzf ff.tar.gz
              sudo mkdir -p /usr/local/bin && sudo cp fastfetch-*/bin/fastfetch /usr/local/bin/
              ;;
            Linux)
              ARCH=x86_64
              [ "$(uname -m)" = "aarch64" ] && ARCH=aarch64
              curl -fsSL -o ff.tar.gz "https://github.com/fastfetch-cli/fastfetch/releases/download/v${VER}/fastfetch-linux-${ARCH}.tar.gz"
              tar -xzf ff.tar.gz
              sudo mkdir -p /usr/local/bin && sudo cp fastfetch-*/bin/fastfetch /usr/local/bin/
              ;;
            Windows)
              ARCH=amd64
              [ "$PROCESSOR_ARCHITECTURE" = "ARM64" ] && ARCH=aarch64
              curl -fsSL -o ff.zip "https://github.com/fastfetch-cli/fastfetch/releases/download/v${VER}/fastfetch-windows-${ARCH}.zip"
              unzip -oq ff.zip
              mv fastfetch-*/fastfetch.exe ./fastfetch.exe
              ;;
          esac

      # 输出当前构建环境的系统信息
      - name: Show system info (fastfetch)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) ./fastfetch.exe || true ;;
            *) fastfetch || true ;;
          esac

      - name: Build for ${{ matrix.platform }}
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        # --publish never 关闭发布，避免残留 draft release 触发需要 GH_TOKEN 的发布流程
        run: npx electron-builder $ARGS --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 'm3u8-player-${{ matrix.platform }}'
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
