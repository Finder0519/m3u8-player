name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  # 手动触发打包（在仓库 Actions 页点击 Run workflow）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: '${{ matrix.platform }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac：GitHub 的 arm64 runner 无法打 DMG(hdiutil 受限)，只产出 zip 免安装包
          - os: macos-latest
            platform: mac
            args: '--mac zip'
          - os: windows-latest
            platform: win
            args: '--win'
          - os: ubuntu-latest
            platform: linux
            args: '--linux'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build for ${{ matrix.platform }}
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        # --publish never 关闭发布，避免残留 draft release 触发需要 GH_TOKEN 的发布流程
        run: npx electron-builder $ARGS --publish never

      - name: Verify macOS app
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "未找到打包后的 macOS .app bundle" >&2
            exit 1
          fi

          echo "Verifying $APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          test -f "$APP_PATH/Contents/_CodeSignature/CodeResources"
          plutil -extract NSLocalNetworkUsageDescription raw -o - "$APP_PATH/Contents/Info.plist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: 'm3u8-player-${{ matrix.platform }}'
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
